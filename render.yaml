services:
  - type: web
    name: voicetext-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: bash backend/build.sh
    startCommand: cd backend && daphne -b 0.0.0.0 -p $PORT voicetext.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: voicetext-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LIVE_MODEL
        value: gemini-2.0-flash-exp
      - key: GEMINI_TEXT_MODEL
        value: gemini-1.5-flash

databases:
  - name: voicetext-db
    region: oregon
    plan: free
    databaseName: voicetext
    user: voicetext_user
